version: 2

models:
  - name: dim_symbol
    description: >
      One row per traded symbol, with a surrogate integer key. Built from the
      symbols that actually appear in staging, so a new symbol in the config
      flows into the warehouse without a manual insert.
    columns:
      - name: symbol_key
        description: Surrogate key. Small integer joins on a 1.1 M-row fact.
        tests: [unique, not_null]
      - name: symbol
        description: Binance trading pair, e.g. BTCUSDT.
        tests: [unique, not_null]
      - name: base_asset
        description: The traded asset, derived from the pair (BTC in BTCUSDT).
      - name: quote_asset
        description: The pricing asset. Always USDT in the current scope.

  - name: fact_candles_1m
    description: >
      One row per symbol per minute, aggregated from every individual trade in
      the Silver lake. About 1/400 of the trade count, which is what keeps SQL
      Server and BI queries fast without losing detail: the trades themselves
      stay in the lake. All timestamps are UTC.
    columns:
      - name: date_key
        description: "Readable date key, e.g. 20261031."
        tests:
          - not_null
          - relationships:
              to: source('gold_seed', 'dim_date')
              field: date_key
      - name: time_key
        description: "Readable minute-of-day key, e.g. 1435 for 14:35."
        tests:
          - not_null
          - relationships:
              to: source('gold_seed', 'dim_time')
              field: time_key
      - name: symbol_key
        description: Foreign key to dim_symbol.
        tests:
          - not_null
          - relationships:
              to: ref('dim_symbol')
              field: symbol_key
      - name: open_price
        description: Price of the first trade of the minute, by aggregate trade id.
      - name: high_price
        description: Highest trade price in the minute.
      - name: low_price
        description: Lowest trade price in the minute.
      - name: close_price
        description: Price of the last trade of the minute, by aggregate trade id.
      - name: volume
        description: Base-asset quantity traded in the minute.
      - name: quote_volume
        description: Quote-asset value traded (sum of price x quantity).
      - name: trade_count
        description: Number of aggregate trades in the minute.
        tests: [not_null]
      - name: buy_volume
        description: >
          Quantity where the buyer was the aggressor. buy_volume +
          sell_volume equals volume.
      - name: sell_volume
        description: Quantity where the seller was the aggressor.
      - name: loaded_at
        description: UTC timestamp of the dbt run that wrote the row.

  - name: fact_coin_market_daily
    description: >
      Daily market context per symbol from CoinGecko (source type 2). Joins
      the same dim_symbol and dim_date as the candle fact, so one query can
      put minute-level trading activity next to that day's market cap.
    columns:
      - name: date_key
        description: Foreign key to dim_date.
        tests:
          - not_null
          - relationships:
              to: source('gold_seed', 'dim_date')
              field: date_key
      - name: symbol_key
        description: Foreign key to dim_symbol.
        tests:
          - not_null
          - relationships:
              to: ref('dim_symbol')
              field: symbol_key
      - name: price_usd
        description: CoinGecko's daily USD price for the coin.
      - name: market_cap_usd
        description: >
          Market capitalisation in USD. Nullable: CoinGecko omits it
          occasionally, and the row is kept for the sake of the price.
      - name: total_volume_usd
        description: Reported 24h trading volume in USD, across all venues. Nullable.
      - name: loaded_at
        description: UTC timestamp of the dbt run that wrote the row.

  - name: fact_fear_greed_daily
    description: >
      Daily crypto Fear & Greed index from alternative.me (source type 2).
      Market-wide rather than per symbol, which is why it is its own fact
      instead of a column on fact_coin_market_daily.
    columns:
      - name: date_key
        description: Foreign key to dim_date. One row per day.
        tests:
          - unique
          - not_null
          - relationships:
              to: source('gold_seed', 'dim_date')
              field: date_key
      - name: fng_value
        description: The index on a 0-100 scale. 0 is extreme fear, 100 extreme greed.
      - name: fng_classification
        description: "The published label for that value, e.g. Extreme Fear."
        tests: [not_null]
      - name: loaded_at
        description: UTC timestamp of the dbt run that wrote the row.

  # --- Reporting layer -------------------------------------------------------
  # Views over the star schema, one per business question from section 1 of
  # the README. A BI tool connects to these instead of writing its own joins,
  # so the definition of "volume per hour" or "buy share" lives in the
  # repository and is tested, not inside a dashboard file.

  - name: vw_symbol_hourly_activity
    description: >
      Business question 1. Volume, turnover and trade count per symbol, day
      and hour of day (UTC), with the hour taken from dim_time so that "at
      which hours" is a plain group-by.
    columns:
      - name: symbol
        tests: [not_null]
      - name: full_date
        tests: [not_null]
      - name: hour_utc
        description: Hour of day in UTC, 0-23.
        tests: [not_null]
      - name: minutes_traded
        description: >
          How many of the hour's 60 minutes actually had trades. A low value
          marks a thin hour, and keeps an average from looking busier than
          the market was.

  - name: vw_symbol_daily_volatility
    description: >
      Business question 2, and the one place where both sources meet. Daily
      open/high/low/close and range per symbol from the candle fact, joined
      to that day's market cap and Fear & Greed value from the API facts.
      Both joins are LEFT: the batch scope and the API lookback do not cover
      exactly the same days.
    columns:
      - name: symbol
        tests: [not_null]
      - name: full_date
        tests: [not_null]
      - name: day_open
        description: Open of the day's first traded minute, by time_key.
      - name: day_close
        description: Close of the day's last traded minute, by time_key.
      - name: day_range_pct
        description: (day_high - day_low) / day_low, as a percentage.
      - name: day_change_pct
        description: (day_close - day_open) / day_open, as a percentage.
      - name: max_minute_range
        description: Largest high-low spread inside a single minute that day.
      - name: avg_minute_range
        description: Mean high-low spread per traded minute.
      - name: market_cap_usd
        description: From CoinGecko. Null on days the API lookback does not cover.
      - name: fng_value
        description: Market-wide Fear & Greed value for the day. Null if not covered.

  - name: vw_symbol_buy_sell_balance
    description: >
      Business question 3. Buy versus sell volume per symbol and day, where
      "buy" means the buyer was the aggressor. buy_share above 0.5 is net
      buying pressure.
    columns:
      - name: symbol
        tests: [not_null]
      - name: full_date
        tests: [not_null]
      - name: net_flow
        description: buy_volume - sell_volume. Negative means net selling.
      - name: buy_share
        description: >
          buy_volume / volume, between 0 and 1. Null on a day with no volume
          at all, rather than a division error.

  # --- Operations ------------------------------------------------------------

  - name: vw_pipeline_health
    description: >
      One row per (layer, entity) in ops.pipeline_runs: how its last run
      went, next to its own history. `health` collapses that into a single
      value an alert query or a dashboard tile can filter on.
    columns:
      - name: layer
        description: bronze / silver / gold / api / maintenance.
        tests: [not_null]
      - name: entity
        description: "What was processed, e.g. BTCUSDT|2026-06 or a lake path."
        tests: [not_null]
      - name: last_status
        tests: [not_null]
      - name: hours_since_last_run
        description: Age of the most recent run, in whole hours UTC.
      - name: last_error_rate
        description: >
          rows_rejected / rows_in for the last run. Null where the job does
          not count input rows (the API and Gold jobs do not).
      - name: health
        description: >
          `ok`, `quality` (last run rejected more than 1% of its input),
          `stale` (nothing for over 48 hours) or `attention` (the last run
          did not end in `processed`). Checked in that order, so a failure
          is never hidden behind a reject rate.
        tests:
          - not_null
          - accepted_values:
              values: ['ok', 'quality', 'stale', 'attention']
