version: 2

models:
  - name: dim_symbol
    columns:
      - name: symbol_key
        tests: [unique, not_null]
      - name: symbol
        tests: [unique, not_null]

  - name: fact_candles_1m
    columns:
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: source('gold_seed', 'dim_date')
              field: date_key
      - name: time_key
        tests:
          - not_null
          - relationships:
              to: source('gold_seed', 'dim_time')
              field: time_key
      - name: symbol_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_symbol')
              field: symbol_key
      - name: trade_count
        tests: [not_null]