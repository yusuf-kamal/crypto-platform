name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.8,<1.0"
      - run: ruff check .

  test:
    name: PySpark unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PySpark needs a JVM. Java 17 matches the Airflow image (see README 13).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # PySpark 3.5.1 has no wheels for 3.13, so the tests run on 3.11 even
      # though the Airflow image uses 3.13. The transform functions under test
      # are plain PySpark and version-independent.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install pyspark==3.5.1 pytest==8.3.4

      # The tests import src.transform.*, so the repo root must be importable.
      - run: pytest tests -q
        env:
          PYTHONPATH: ${{ github.workspace }}
          SPARK_LOCAL_IP: 127.0.0.1
