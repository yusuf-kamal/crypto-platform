# Fixed project name, so the Docker network the dbt container joins is
# predictable (crypto-platform_default) for the dbt_build DAG.
name: crypto-platform

x-airflow-common: &airflow-common
  build: ./docker/airflow
  image: crypto-airflow:1.0
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    PYTHONPATH: /opt/airflow
    AIRFLOW_CONN_MINIO_S3: '{"conn_type":"aws","login":"${MINIO_ROOT_USER}","password":"${MINIO_ROOT_PASSWORD}","extra":{"endpoint_url":"http://minio:9000","region_name":"us-east-1"}}'
    S3_ENDPOINT: http://minio:9000
    MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    MSSQL_HOST: ${MSSQL_HOST}
    MSSQL_PORT: ${MSSQL_PORT}
    MSSQL_DB: ${MSSQL_DB}
    MSSQL_USER: ${MSSQL_USER}
    MSSQL_PASSWORD: ${MSSQL_PASSWORD}
    DBT_IMAGE: crypto-dbt:1.0
    DOCKER_NETWORK: crypto-platform_default
    # Optional: a Slack-style incoming webhook. Empty means log-only alerts.
    ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    KAFKA_BOOTSTRAP: kafka:9092
    KAFKA_TOPIC: binance.trades
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./src:/opt/airflow/src
    - ./tests:/opt/airflow/tests
    # The dbt_build DAG starts the dbt container through this socket.
    # It gives the Airflow containers control over the host Docker daemon,
    # which is acceptable for a local, single-user setup only.
    - /var/run/docker.sock:/var/run/docker.sock
  depends_on:
    postgres:
      condition: service_healthy
    mssql-init:
      condition: service_completed_successfully
services:
  # The warehouse now runs in Compose, so `docker compose up -d` is the whole
  # setup: mssql-init applies every script in sql/ and the Airflow services
  # wait for it to finish.
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "${MSSQL_HOST_PORT:-14330}:1433"
    volumes:
      - mssql_data:/var/opt/mssql

  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-init
    depends_on:
      - mssql
    environment:
      MSSQL_HOST: mssql
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PASSWORD: ${MSSQL_PASSWORD}
    entrypoint: ["/bin/sh", "/init/init.sh"]
    volumes:
      - ./sql:/sql:ro
      - ./docker/mssql:/init:ro
    restart: "no"

  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/bronze local/silver local/gold
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  
  postgres:
    image: postgres:16
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    command: db migrate
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    container_name: airflow-apiserver
    command: api-server
    ports:
      - "8085:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow-triggerer
    command: triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully 

  jupyter:
    <<: *airflow-common
    container_name: jupyter
    command:
      - python
      - -m
      - jupyterlab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --ServerApp.token=
    profiles: ["dev"]
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - ./src:/opt/airflow/src
      - ./notebooks:/opt/airflow/notebooks 

  dbt:
    build:
      context: .
      dockerfile: docker/dbt/Dockerfile
    image: crypto-dbt:1.0
    profiles: ["tools"]
    entrypoint: ["dbt"]
    working_dir: /app/dbt
    environment:
      DBT_PROFILES_DIR: /app/dbt
      MSSQL_HOST: ${MSSQL_HOST}
      MSSQL_PORT: ${MSSQL_PORT}
      MSSQL_DB: ${MSSQL_DB}
      MSSQL_USER: ${MSSQL_USER}
      MSSQL_PASSWORD: ${MSSQL_PASSWORD}
    volumes:
      - ./dbt:/app/dbt           

  # --- Streaming path (profile: streaming) -------------------------------
  # Kept behind a profile because it is a long-running path, not a scheduled
  # one: `docker compose --profile streaming up -d`.
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    profiles: ["streaming"]
    environment:
      CLUSTER_ID: crypto-platform-kraft-01
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Single broker, so every replication factor has to be 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # A laptop-sized buffer: the topic is a hand-off, not the archive.
      KAFKA_LOG_RETENTION_HOURS: 24
    volumes:
      - kafka_data:/var/lib/kafka/data

  trade-producer:
    build:
      context: .
      dockerfile: docker/streaming/Dockerfile
    image: crypto-streaming:1.0
    container_name: trade-producer
    profiles: ["streaming"]
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: binance.trades
    restart: unless-stopped

  trade-consumer:
    <<: *airflow-common
    container_name: trade-consumer
    profiles: ["streaming"]
    # The Airflow entrypoint prepends `airflow` to an unknown command, so the
    # job is started as a module, the same trick the jupyter service uses.
    command:
      - python
      - -m
      - src.streaming.trades_stream_job
    restart: unless-stopped

volumes:
  mssql_data:
  kafka_data:
  minio_data:
  postgres_data: